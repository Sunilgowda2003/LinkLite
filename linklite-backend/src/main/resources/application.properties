spring.application.name=linklite-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/linklite_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

linklite.base-url=${LINKLITE_BASE_URL:http://localhost:8080}

linklite.jwt.secret=${LINKLITE_JWT_SECRET}
linklite.jwt.expiration-ms=86400000